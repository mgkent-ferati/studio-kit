name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefungen:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build --target ci -t studio-kit:ci .
      - name: Prüfungen
        run: >-
          docker run --rm --network host
          -e APP_ENV=test
          -e DATABASE_URL="postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8"
          studio-kit:ci composer ci
