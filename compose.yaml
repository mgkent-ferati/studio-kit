name: studio-kit

services:
  app:
    build:
      context: .
      target: base
    volumes:
      - ./:/app
      - ${STUDIO_KIT_DATEN_HOST:?Bitte bin/dc statt docker compose verwenden}/dateien:/daten/dateien
    ports:
      # Nur lokal erreichbar, nicht im Netzwerk
      - "127.0.0.1:8090:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${STUDIO_KIT_DATEN_HOST:?Bitte bin/dc statt docker compose verwenden}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 2s
      timeout: 3s
      retries: 30
